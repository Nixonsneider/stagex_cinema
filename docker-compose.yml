services:
  postgres:
    image: postgres:17-alpine
    container_name: stagex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stagex}
      POSTGRES_USER: ${POSTGRES_USER:-stagex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stagex_local_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - stagex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stagex-postgres-data:
