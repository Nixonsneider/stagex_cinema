spring.config.activate.on-profile=local

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/stagex}
spring.datasource.username=${DATABASE_USERNAME:stagex}
spring.datasource.password=stagex_local_dev
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
# T-019: los datos demo (db/demo) solo se cargan en local. Producción usa solo db/migration.
spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.flyway.user=${DATABASE_USERNAME:stagex}
spring.flyway.password=stagex_local_dev
