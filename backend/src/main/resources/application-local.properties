spring.config.activate.on-profile=local

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/stagex}
spring.datasource.username=${DATABASE_USERNAME:stagex}
spring.datasource.password=stagex_local_dev
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
