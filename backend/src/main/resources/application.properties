spring.application.name=stagex-backend
management.endpoints.web.exposure.include=health,info

# Pagos (T-046). En V1.0 solo existe el proveedor "sandbox", que no cobra dinero.
# El secreto por defecto solo sirve para desarrollo; en cualquier entorno compartido
# se debe definir PAYMENT_PROVIDER_SECRET.
stagex.payment.provider=sandbox
stagex.payment.sandbox.checkout-base-url=${PAYMENT_PROVIDER_URL:http://localhost:8080/sandbox}
stagex.payment.sandbox.secret=${PAYMENT_PROVIDER_SECRET:sandbox-dev-only-secret}
stagex.payment.sandbox.session-ttl=PT10M
