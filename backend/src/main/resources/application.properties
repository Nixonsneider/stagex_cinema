spring.application.name=stagex-backend
management.endpoints.web.exposure.include=health,info

# Pagos (T-046). En V1.0 solo existe el proveedor "sandbox", que no cobra dinero.
# El secreto por defecto solo sirve para desarrollo; en cualquier entorno compartido
# se debe definir PAYMENT_PROVIDER_SECRET.
stagex.payment.provider=sandbox
stagex.payment.sandbox.checkout-base-url=${PAYMENT_PROVIDER_URL:http://localhost:8080/sandbox}
stagex.payment.sandbox.secret=${PAYMENT_PROVIDER_SECRET:sandbox-dev-only-secret}
stagex.payment.sandbox.session-ttl=PT10M

# Autenticación (T-014 a T-018). Los valores por defecto solo sirven para desarrollo;
# en cualquier entorno compartido se deben definir JWT_SECRET (32 bytes o más) y FRONTEND_URL.
stagex.auth.jwt-secret=${JWT_SECRET:stagex-dev-only-jwt-secret-change-me-0123456789}
stagex.auth.access-token-ttl=PT15M
stagex.auth.refresh-token-ttl=P7D
stagex.auth.verification-token-ttl=P1D
stagex.auth.password-reset-token-ttl=PT1H
stagex.auth.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Correo (T-051 usará el mismo puerto). En V1.0 solo existe el proveedor "sandbox", que no envía nada.
stagex.mail.provider=sandbox
